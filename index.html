:root{
  --shelf:#16181d; --shelf-ink:#eceef2; --shelf-mute:#a3a9b5;
  --han:'Han Title','Black Han Sans','Noto Sans KR',sans-serif;
  --body:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
  --pixel:'Galmuri Title','Galmuri11',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--shelf);color:var(--shelf-ink);font:400 16px/1.6 var(--body);word-break:keep-all}
.wrap{max-width:860px;margin:0 auto;padding:32px 24px 56px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{margin:0;font:400 24px/1.2 var(--han);letter-spacing:.01em;white-space:nowrap}
header p{margin:0;font-size:14px;color:var(--shelf-mute)}
.head-r{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap;min-width:0}
#acc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--shelf-mute);min-width:0}
#acc[hidden]{display:none}
#acc b{color:var(--shelf-ink);font-weight:500;overflow-wrap:anywhere}
#acc em{font-style:normal;color:#ffb0b5}
#acc button{height:36px;padding:0 12px;font:500 13px var(--body);color:var(--shelf-ink);background:#262a33;border:1px solid #4a5160;cursor:pointer}
#acc button:hover{background:#333844}
#acc button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.progress{font-size:13px;font-weight:700;color:var(--ink);text-align:center}
#games{list-style:none;margin:0;padding:0;display:grid;gap:16px}

/* 공통 뼈대: 왼쪽은 게임 간판, 오른쪽은 상태와 버튼 */
.game{position:relative;display:grid;grid-template-columns:1fr 176px;gap:14px 32px;align-items:center;padding:20px 24px;color:var(--ink);background:var(--bg);overflow:hidden}
.game h2{margin:0;font-weight:400}
.game .desc{margin:8px 0 0;max-width:36em;font-size:14px;line-height:1.5;color:var(--desc)}
.side{display:grid;gap:8px;justify-items:stretch}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:500;color:var(--desc)}
.play{display:block;padding:8px 12px;font-size:15px;text-align:center;font-weight:700;text-decoration:none;color:var(--btn-ink);background:var(--btn)}
.repo{justify-self:center;font-size:13px;color:var(--desc);text-underline-offset:3px}
a:focus-visible{outline:3px solid var(--focus,#fff);outline-offset:3px}

/* 피트월: 어두운 중계 화면, 기울어진 제목과 체크무늬 */
.t-pitwall{--bg:radial-gradient(90% 130% at 62% 0,#26303d 0,#10141c 58%,#090b10 100%);--ink:#fff;--desc:#c3ccd9;--btn:#12d6b0;--btn-ink:#06231d;--focus:#12d6b0}
.t-pitwall h2{font:400 clamp(26px,4.2vw,36px)/1.1 var(--han);transform:skewX(-9deg);transform-origin:left bottom}
.t-pitwall .flagline{display:block;width:min(100%,264px);height:8px;margin-top:8px;transform:skewX(-9deg);transform-origin:left bottom;background:repeating-conic-gradient(#f2f4f7 0 25%,transparent 0 50%) 0 0/8px 8px}
.t-pitwall .play{clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);transition:background .12s}
.t-pitwall .play:hover{background:#3df0cd}

/* 창공배: 하늘에서 잔디로 내려오는 배경 위에 기울어진 종이 간판 */
.t-sky{--bg:linear-gradient(180deg,#2b2a70 0,#27475e 55%,#20593f 100%);--ink:#fff;--desc:#e8ecef;--btn:#b8352a;--btn-ink:#fff;--focus:#e9be52}
.t-sky h2{display:inline-block;padding:6px 16px 5px;background:#fbf4e3;border:2px solid #1e2a38;box-shadow:4px 4px 0 #1e2a38;transform:rotate(-1.4deg);font:400 clamp(24px,3.8vw,32px)/1.15 var(--han);color:#1e2a38}
.t-sky h2 .a{color:#b8352a;margin-right:.28em}
.t-sky .desc{margin-top:12px}
.t-sky .play{border:2px solid #1e2a38;box-shadow:3px 3px 0 #1e2a38;transition:transform .1s,box-shadow .1s}
.t-sky .play:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 #1e2a38}

/* MONO FLIGHT: 순수한 흑백, 각진 픽셀 */
.t-mono{--bg:#000;--ink:#fff;--desc:#c9c9c9;--btn:#fff;--btn-ink:#000;--focus:#fff;border:2px solid #fff;box-shadow:6px 6px 0 #33363d}
.t-mono h2{font:700 clamp(26px,4.4vw,38px)/1.08 var(--pixel);letter-spacing:.01em}
.t-mono .sub{display:block;margin-top:4px;font:700 12px/1.4 var(--pixel);letter-spacing:.35em;color:#d8d8d8}
.t-mono .meta,.t-mono .play{font-family:var(--pixel)}
.t-mono .play:hover{background:#000;color:#fff;outline:3px solid #fff;outline-offset:-3px}

/* 새 게임의 기본 모양: bg·btn 색만 넣으면 됩니다 */
.t-plain{--ink:#fff;--desc:#dfe2e8}
.t-plain h2{font:400 clamp(24px,3.8vw,32px)/1.15 var(--han)}

@media (max-width:680px){
  .wrap{padding:20px 16px 40px}
  .game{grid-template-columns:1fr;padding:16px}
  .side{grid-template-columns:1fr auto;align-items:center;gap:10px 16px}
  .meta{grid-column:1/-1;justify-content:flex-start;gap:16px}
  .progress{grid-column:1/-1;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>내 게임</h1>
    <div class="head-r"><p id="count"></p><div id="acc" hidden></div></div>
  </header>
  <ul id="games"></ul>
</div>

<script>
/* 새 게임은 이 목록에 한 줄 추가합니다.
   repo: 저장소 이름, status: '개발 중' 또는 '완성', updated: 수정일을 못 가져올 때 쓰는 값 */

const CACHE_KEY = 'pushed-dates-v1';
const CACHE_MS = 30 * 60 * 1000;

function dayGap(iso){
  const start = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((start(new Date()) - start(new Date(iso))) / 86400000);
}
function whenText(iso){
  const n = dayGap(iso);
  if (n <= 0) return '오늘 수정';
  if (n === 1) return '어제 수정';
  if (n < 30) return n + '일 전 수정';
  const d = new Date(iso);
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 수정';
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function card(g){
  const li = el('li', 'game t-' + (g.theme || 'plain'));
  if (g.bg) li.style.setProperty('--bg', g.bg);
  if (g.btn) { li.style.setProperty('--btn', g.btn); li.style.setProperty('--btn-ink', g.btnInk || '#fff'); }

  const main = el('div');
  const h2 = el('h2');
  const parts = g.title.split('|');
  if (parts.length === 2) {
    h2.setAttribute('aria-label', parts.join(' '));
    h2.append(el('span', 'a', parts[0]), el('span', 'b', parts[1]));
  } else h2.textContent = g.title;
  main.append(h2);
  if (g.sub) main.append(el('span', 'sub', g.sub));
  if (g.theme === 'pitwall') main.append(el('span', 'flagline'));
  main.append(el('p', 'desc', g.desc));

  const side = el('div', 'side');
  const meta = el('div', 'meta');
  meta.append(el('span', '', g.status), el('span', '', whenText(g.updated)));
  const play = el('a', 'play', '게임 열기');
  play.href = 'https://' + OWNER + '.github.io/' + g.repo + '/';
  const repo = el('a', 'repo', '저장소 보기');
  repo.href = 'https://github.com/' + OWNER + '/' + g.repo;
  side.append(meta);
  if (g.progress) side.append(el('div', 'progress', g.progress));
  side.append(play, repo);

  li.append(main, side);
  return li;
}
function render(){
  const list = document.getElementById('games');
  list.replaceChildren(...[...GAMES].sort((a,b) => new Date(b.updated) - new Date(a.updated)).map(card));
  document.getElementById('count').textContent = '최근 수정한 순서';
}
function apply(dates){
  GAMES.forEach(g => { if (dates[g.repo]) g.updated = dates[g.repo]; });
  render();
}
function readCache(){
  try {
    const c = JSON.parse(sessionStorage.getItem(CACHE_KEY));
    if (c && Date.now() - c.at < CACHE_MS) return c.dates;
  } catch (e) {}
  return null;
}
async function refresh(){
  const cached = readCache();
  if (cached) return apply(cached);
  const dates = {};
  await Promise.all(GAMES.map(async g => {
    try {
      const r = await fetch('https://api.github.com/repos/' + OWNER + '/' + g.repo);
      if (r.ok) dates[g.repo] = (await r.json()).pushed_at;
    } catch (e) {}
  }));
  if (Object.keys(dates).length) {
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), dates })); } catch (e) {}
    apply(dates);
  }
}

/* 이 프로젝트에 기록을 저장하는 게임의 저장 위치와 카드에 보일 진행 상황 */
const PROGRESS = {
  'pitwall-gp': { path:'pitwall/', text:d => '시즌 ' + (d.season || 1) + ' · ' + (d.round >= 12 ? '시즌 종료' : '라운드 ' + ((d.round || 0) + 1) + '/12') },

  'mono-frog':  { path:'games/mono-frog/', text:d => { const r = d.rec || {}; return r.cleared ? '우물 탈출' : r.best ? '최고 ' + r.best + 'm · ' + (r.maxZone || 1) + '/5구역' : ''; } },
  'quidditch':  { path:'saves/',   text:d => d.phase === 'choose' ? '' : '시즌 ' + (d.season || 1) + ' · ' + (d.phase === 'regular' ? '라운드 ' + ((d.round || 0) + 1) : d.phase === 'playoff' ? '플레이오프' : '비시즌') }
};
const account = { auth:null, user:null, msg:'' };
function loadScript(u){
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = no; document.head.append(s); });
}
function renderAccount(){
  const box = document.getElementById('acc');
  if (!account.auth) { box.hidden = !account.msg; box.replaceChildren(el('em', '', account.msg)); return; }
  box.hidden = false;
  const btn = el('button', '', account.user ? '로그아웃' : '구글로 로그인');
  btn.type = 'button';
  btn.onclick = account.user ? () => account.auth.signOut() : login;
  if (account.user) box.replaceChildren(el('b', '', account.user.email || account.user.displayName || '내 계정'), btn);
  else box.replaceChildren(btn, ...(account.msg ? [el('em', '', account.msg)] : []));
}
function loginError(e){
  const c = e && e.code || '';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '';
  if (c === 'auth/network-request-failed') return '인터넷 연결을 확인해 주세요.';
  return '로그인하지 못했습니다. 다시 시도해 주세요.';
}
function login(){
  account.msg = '';
  const pv = new firebase.auth.GoogleAuthProvider();
  account.auth.signInWithPopup(pv).catch(e => {
    const c = e && e.code || '';
    if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') {
      account.auth.signInWithRedirect(pv).catch(x => { account.msg = loginError(x); renderAccount(); });
      return;
    }
    account.msg = loginError(e); renderAccount();
  });
}
async function loadProgress(user){
  await Promise.all(GAMES.map(async g => {
    g.progress = '';
    const p = PROGRESS[g.repo];
    if (!p || !user) return;
    try {
      const v = (await firebase.database().ref(p.path + user.uid).once('value')).val();
      if (v && v.json) g.progress = p.text(JSON.parse(v.json));
    } catch (e) {}
  }));
  render();
}
async function initAccount(){
  const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
  try {
    await loadScript(base + 'firebase-app-compat.js');
    await loadScript(base + 'firebase-auth-compat.js');
    await loadScript(base + 'firebase-database-compat.js');
    firebase.initializeApp(FIREBASE_CFG);
    account.auth = firebase.auth();
    if (account.auth.getRedirectResult) account.auth.getRedirectResult().catch(e => { account.msg = loginError(e); renderAccount(); });
    account.auth.onAuthStateChanged(u => { account.user = u || null; renderAccount(); loadProgress(account.user); });
    renderAccount();
  } catch (e) {
    account.msg = '로그인 기능을 불러오지 못했습니다.'; renderAccount();
  }
}
render();
refresh();
initAccount();
